# ABOUTME: Python package configuration for McMaster-Carr MCP server.
# ABOUTME: Defines dependencies, entry points, and build configuration.

[project]
name = "mcmaster-mcp"
version = "0.1.0"
description = "MCP server for McMaster-Carr product lookup via web scraping"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Matt Braun"}
]
keywords = ["mcp", "mcmaster-carr", "web-scraping", "seleniumbase"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=2.0.0",
    "seleniumbase>=4.25.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
mcmaster-mcp = "server:main"

[project.urls]
Repository = "https://github.com/mjbraun/radiatron"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = [
    "server.py",
    "browser.py",
    "agent.py",
]
